[project]
name = "tts-bench"
version = "0.1.0"
description = "A modern, batteries-included evaluation library for open-source and API-based TTS models"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amir", email = "amhajavi@gmail.com" }
]
keywords = ["text-to-speech", "tts", "evaluation", "benchmarking", "speech", "audio", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "coqui-tts>=0.27.1",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "kokoro>=0.9.4",
    "numpy==1.26.4",
    "speechbrain>=1.1.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchmetrics[audio]>=1.9.0",
    "transformers==4.56.0",
    "utmosv2",
]

[project.urls]
Homepage = "https://github.com/amhajavi/tts-bench"
Repository = "https://github.com/amhajavi/tts-bench"
Issues = "https://github.com/amhajavi/tts-bench/issues"

[project.scripts]
tts-bench = "tts_bench.cli.general:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
utmosv2 = { git = "https://github.com/sarulab-speech/UTMOSv2.git" }
